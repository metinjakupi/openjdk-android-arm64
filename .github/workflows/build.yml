name: Build JRE 21 for Android arm64

# Manual runs produce a workflow artifact for testing. Pushing a tag named
# jre21-* also publishes a permanent release with the runtime, its full
# corresponding source and checksums.
on:
  workflow_dispatch:
  push:
    tags: ['jre21-*']

permissions:
  contents: write

jobs:
  build:
    name: Build JRE 21 (aarch64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build
      run: bash ci_build_arch_aarch64.sh

    - name: Pack corresponding source
      run: bash pack_source.sh

    - name: Checksums
      run: |
        sha256sum jre21-*.tar.xz openjdk-*-src.tar.xz > SHA256SUMS
        cat SHA256SUMS

    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: jre21-arm64
        path: |
          jre21-*.tar.xz
          openjdk-*-src.tar.xz
          SHA256SUMS

    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        . ./pins.sh
        cat > notes.md <<NOTES
        OpenJDK \`${JDK_TAG}\` runtime for Android arm64 (bionic), built by workflow run ${{ github.run_id }} from commit ${{ github.sha }}.

        - \`jre21-arm64-*.tar.xz\`: the runtime
        - \`openjdk-*-android-src.tar.xz\`: its complete corresponding source (OpenJDK with the patches in \`patches/\` applied)
        - \`SHA256SUMS\`: checksums of both

        OpenJDK is licensed under GPLv2 with the Classpath Exception.
        NOTES
        gh release create "$GITHUB_REF_NAME" jre21-*.tar.xz openjdk-*-src.tar.xz SHA256SUMS \
          --title "$GITHUB_REF_NAME" --notes-file notes.md
